<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Music Note Explorer</title>
<style>
    body {
        font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        background-color: #f0f8ff;
        text-align: center;
        margin: 0;
        padding: 10px;
        touch-action: manipulation;
    }
    #start-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255, 255, 255, 0.95);
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        z-index: 1000;
    }
    button {
        font-size: 24px; padding: 15px 30px; margin: 10px;
        background-color: #4CAF50; color: white; border: none;
        border-radius: 15px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button:active { transform: translateY(2px); }
    
    #controls { margin-bottom: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    select { font-size: 18px; padding: 5px; border-radius: 10px; border: 1px solid #ccc; background: white; }
    
    #staff-container {
        background: white; border-radius: 15px; padding: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 10px auto;
        max-width: 600px; overflow-x: auto;
    }
    svg { width: 100%; max-height: 200px; display: block; }
    
    #feedback-area {
        height: 80px; display: flex; justify-content: center; align-items: center;
        font-size: 40px; font-weight: bold; margin-bottom: 10px;
    }
    #help-btn { background-color: #2196F3; display: none; font-size: 18px; padding: 10px 20px;}
    
    /* Piano Keyboard CSS */
    #keyboard {
        display: flex; justify-content: center; position: relative;
        height: 150px; max-width: 800px; margin: 0 auto;
        border-radius: 5px; overflow: hidden;
    }
    .key-white {
        flex: 1; height: 100%; background: white; border: 1px solid #ccc;
        border-bottom-left-radius: 5px; border-bottom-right-radius: 5px;
        box-shadow: 0 3px 5px rgba(0,0,0,0.2); cursor: pointer;
    }
    .key-white:active, .key-white.active { background: #e0e0e0; }
    .key-black {
        width: 5%; height: 60%; background: black; position: absolute;
        top: 0; margin-left: -2.5%; z-index: 2; border-bottom-left-radius: 3px;
        border-bottom-right-radius: 3px; cursor: pointer;
    }
    .key-black:active, .key-black.active { background: #333; }

    /* Multiple Choice Buttons for Chords */
    #multiple-choice {
        display: none; justify-content: center; gap: 15px; flex-wrap: wrap; max-width: 800px; margin: 0 auto;
    }
    .mc-btn {
        font-size: 20px; padding: 15px 25px; margin: 5px;
        background-color: #9C27B0; color: white; border: none;
        border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .mc-btn.correct { background-color: #4CAF50; }
    .mc-btn.wrong { background-color: #F44336; }
</style>
</head>
<body>

<div id="start-screen">
    <h1>🎵 Music Explorer 🎵</h1>
    <p>Tap below to unlock the sound!</p>
    <button onclick="initApp()">Start Playing</button>
</div>

<div id="controls">
    <select id="clef-select" onchange="loadExercise()">
        <option value="treble">Treble Clef (𝄞)</option>
        <option value="bass">Bass Clef (𝄢)</option>
    </select>
    <select id="level-select" onchange="onLevelChange()">
        <option value="single">Single Notes</option>
        <option value="songs">Songs</option>
        <option value="chords">Chord Practice</option>
        <option value="freeplay">Free Play</option>
    </select>
    
    <select id="accidentals-select" onchange="loadExercise()">
        <option value="none">No Sharps/Flats</option>
        <option value="all">Include Sharps/Flats</option>
    </select>
    
    <select id="key-select" onchange="loadExercise()" style="display:none;">
        <option value="C">C Major (0)</option>
        <option disabled>── Sharps ──</option>
        <option value="G">G Major (1♯)</option>
        <option value="D">D Major (2♯)</option>
        <option value="A">A Major (3♯)</option>
        <option value="E">E Major (4♯)</option>
        <option value="B">B Major (5♯)</option>
        <option disabled>── Flats ──</option>
        <option value="F">F Major (1♭)</option>
        <option value="Bb">Bb Major (2♭)</option>
        <option value="Eb">Eb Major (3♭)</option>
        <option value="Ab">Ab Major (4♭)</option>
        <option value="Db">Db Major (5♭)</option>
    </select>
</div>

<div id="staff-container">
    <svg id="staff" viewBox="0 0 450 200">
        <line x1="0" y1="40" x2="450" y2="40" stroke="black" stroke-width="2"/>
        <line x1="0" y1="60" x2="450" y2="60" stroke="black" stroke-width="2"/>
        <line x1="0" y1="80" x2="450" y2="80" stroke="black" stroke-width="2"/>
        <line x1="0" y1="100" x2="450" y2="100" stroke="black" stroke-width="2"/>
        <line x1="0" y1="120" x2="450" y2="120" stroke="black" stroke-width="2"/>
        <text id="clef-symbol" x="10" y="110" font-size="80" font-family="serif">𝄞</text>
        <g id="notes-layer"></g>
        <g id="feedback-layer"></g>
    </svg>
</div>

<div id="feedback-area">
    <span id="face-emoji">🤔</span>
    <span id="feedback-text" style="margin-left: 15px; font-size: 28px;">Let's play!</span>
    <button id="help-btn" onclick="playHelpSequence()">🔊 Hear Scale</button>
</div>

<div id="keyboard"></div>
<div id="multiple-choice"></div>

    function initApp() {
        document.getElementById('start-screen').style.display = 'none';
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        onLevelChange();
    }

    function onLevelChange() {
        const level = document.getElementById('level-select').value;
        document.getElementById('accidentals-select').style.display = level === 'single' ? 'inline-block' : 'none';
        document.getElementById('key-select').style.display = level === 'chords' ? 'inline-block' : 'none';
        document.getElementById('keyboard').style.display = level === 'chords' ? 'none' : 'flex';
        document.getElementById('multiple-choice').style.display = level === 'chords' ? 'flex' : 'none';
        
        lastSequenceData = null; 
        loadExercise();
    }

    function buildKeyboard(keysArray) {
        const kb = document.getElementById('keyboard');
        kb.innerHTML = '';
        let whiteCount = 0;
        const totalWhite = keysArray.filter(k => pitches[k].type === 'white').length;
        
        keysArray.forEach(key => {
            const p = pitches[key];
            const div = document.createElement('div');
            div.dataset.note = key;
            
            if(p.type === 'white') {
                div.className = 'key-white';
                whiteCount++;
            } else {
                div.className = 'key-black';
                div.style.left = `${(whiteCount / totalWhite) * 100}%`;
                div.style.width = `${100 / totalWhite * 0.65}%`; 
                div.style.marginLeft = `-${100 / totalWhite * 0.325}%`;
            }
            
            div.onmousedown = () => handleKeyPress(key, div);
            div.ontouchstart = (e) => { e.preventDefault(); handleKeyPress(key, div); };
            kb.appendChild(div);
        });
    }

    function playSound(frequency) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1);
    }

    function playHelpSequence() {
        const level = document.getElementById('level-select').value;
        
        // Preserve chord logic: play the chord directly
        if (level === 'chords' && currentChordTarget) {
            currentChordTarget.notes.forEach(n => playSound(pitches[n].f));
            return;
        } 
        
        // Scale Sequence Logic for Single Notes / Songs
        const isTreble = document.getElementById('clef-select').value === 'treble';
        const keys = isTreble ? keysOrderTreble : keysOrderBass;
        
        // Find C4 index. If not found in the current clef array, default to index 0
        let startIndex = keys.indexOf('C4');
        if (startIndex === -1) startIndex = 0;
        
        const helpSequence = keys.slice(startIndex);
        const helpLayer = document.getElementById('feedback-layer');
        
        const startX = 120; 
        const targetX = startX + (currentIndex * 45) + 60; // Shifts the temporary note 60px to the right
        
        let i = 0;
        const helpBtn = document.getElementById('help-btn');
        helpBtn.disabled = true; // Prevent rapid clicking

        clearTimeout(helpSequenceTimeout);

        function playNext() {
            if (i >= helpSequence.length) {
                setTimeout(() => { helpLayer.innerHTML = ''; }, 500);
                helpBtn.disabled = false;
                return;
            }
            
            const note = helpSequence[i];
            playSound(pitches[note].f);
            
            helpLayer.innerHTML = '';
            // Draw the temporary note in blue (#2196F3)
            drawNoteVisual(helpLayer, targetX, pitches[note], "#2196F3", false);
            
            i++;
            helpSequenceTimeout = setTimeout(playNext, 500); // 500ms between each note
        }
        
        playNext();
    }

    function speak(text) {
        window.speechSynthesis.cancel();
        clearTimeout(voiceTimeout);
        voiceTimeout = setTimeout(() => {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }, 500);
    }

    function renderMultipleChoice(correctObj, pool) {
        const mc = document.getElementById('multiple-choice');
        mc.innerHTML = '';
        
        let others = pool.filter(c => c.name !== correctObj.name);
        others.sort(() => Math.random() - 0.5);
        
        let options = [correctObj, others[0], others[1], others[2]];
        options.sort(() => Math.random() - 0.5); 
        
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt.name;
            btn.className = 'mc-btn';
            btn.onclick = () => handleChoiceClick(opt.name, correctObj.name, btn);
            mc.appendChild(btn);
        });
    }

    function loadExercise() {
        clearTimeout(helpSequenceTimeout); // Stops visual playback if exercise resets
        const level = document.getElementById('level-select').value;
        const clef = document.getElementById('clef-select').value;
        const isTreble = clef === 'treble';
        
        const clefSymbol = document.getElementById('clef-symbol');
        if (isTreble) {
            clefSymbol.textContent = '𝄞';
            clefSymbol.setAttribute('y', '110');
            clefSymbol.setAttribute('font-size', '80');
        } else {
            clefSymbol.textContent = '𝄢';
            clefSymbol.setAttribute('y', '95'); 
            clefSymbol.setAttribute('font-size', '80');
        }

        buildKeyboard(isTreble ? keysOrderTreble : keysOrderBass);

        document.getElementById('notes-layer').innerHTML = '';
        document.getElementById('feedback-layer').innerHTML = '';
        
        mistakes = 0;
        currentIndex = 0;
        chordProgress = [];
        currentChordTarget = null;
        document.getElementById('help-btn').style.display = 'none';
        document.getElementById('help-btn').disabled = false; // Reset button state

        let newChoice;
        
        if (level === 'freeplay') {
            currentSequence = [];
            updateUIFeedback("🎹", "Free Play!", "black");
            
        } else if (level === 'single') {
            updateUIFeedback("🤔", "Let's play!", "black");
            const acc = document.getElementById('accidentals-select').value;
            let pool = isTreble ? keysOrderTreble : keysOrderBass;
            if (acc === 'none') {
                pool = pool.filter(n => pitches[n].type === 'white');
            }
            do { newChoice = pool[Math.floor(Math.random() * pool.length)]; }
            while(newChoice === lastSequenceData && pool.length > 1);
            
            lastSequenceData = newChoice;
            currentSequence = [newChoice];
            drawSequence();
            
        } else if (level === 'songs') {
            updateUIFeedback("🤔", "Let's play!", "black");
            const pool = songPools[isTreble ? 'treble' : 'bass'];
            do { newChoice = pool[Math.floor(Math.random() * pool.length)]; }
            while(JSON.stringify(newChoice) === lastSequenceData && pool.length > 1);
            
            lastSequenceData = JSON.stringify(newChoice);
            currentSequence = newChoice;
            drawSequence();
            
        } else if (level === 'chords') {
            updateUIFeedback("🤔", "Let's play!", "black");
            const keySig = document.getElementById('key-select').value;
            const pool = chordDict[keySig][isTreble ? 'treble' : 'bass'];
            do { newChoice = pool[Math.floor(Math.random() * pool.length)]; }
            while(newChoice.name === lastSequenceData && pool.length > 1);
            
            lastSequenceData = newChoice.name;
            currentChordTarget = newChoice;
            currentSequence = [newChoice.notes]; 
            
            renderMultipleChoice(newChoice, pool);
            drawSequence();
        }
    }

    function drawSequence() {
        const layer = document.getElementById('notes-layer');
        layer.innerHTML = '';
        const startX = 120; // Increased spacing base
        const spacing = 45;

        currentSequence.forEach((item, index) => {
            const x = startX + (index * spacing);
            const notesToDraw = Array.isArray(item) ? item : [item];
            
            notesToDraw.forEach(note => {
                const p = pitches[note];
                let color = "black";
                
                if (index < currentIndex) {
                    color = "#a0a0a0"; 
                } else if (Array.isArray(item) && chordProgress.includes(note)) {
                    color = "#4CAF50"; 
                }
                
                drawNoteVisual(layer, x, p, color, index === currentIndex && !Array.isArray(item));
            });
        });
    }

    function drawNoteVisual(layer, x, pitchObj, color, isCurrentSingle) {
        const clef = document.getElementById('clef-select').value;
        const yPos = clef === 'treble' ? pitchObj.yTreble : pitchObj.yBass;

        if (yPos >= 140) {
            for (let l = 140; l <= yPos; l += 20) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x - 15); line.setAttribute("y1", l);
                line.setAttribute("x2", x + 15); line.setAttribute("y2", l);
                line.setAttribute("stroke", color); line.setAttribute("stroke-width", "2");
                layer.appendChild(line);
            }
        }
        if (yPos <= 20) {
            for (let l = 20; l >= yPos; l -= 20) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x - 15); line.setAttribute("y1", l);
                line.setAttribute("x2", x + 15); line.setAttribute("y2", l);
                line.setAttribute("stroke", color); line.setAttribute("stroke-width", "2");
                layer.appendChild(line);
            }
        }

        const ellipse = document.createElementNS("http://www.w3.org/2000/svg", "ellipse");
        ellipse.setAttribute("cx", x); ellipse.setAttribute("cy", yPos);
        ellipse.setAttribute("rx", 10); ellipse.setAttribute("ry", 7);
        ellipse.setAttribute("fill", color);
        ellipse.setAttribute("transform", `rotate(-15 ${x} ${yPos})`);
        
        if(isCurrentSingle && color === "black") {
            ellipse.setAttribute("stroke", "#4CAF50");
            ellipse.setAttribute("stroke-width", "2");
        }
        layer.appendChild(ellipse);

        if(pitchObj.acc) {
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", x - 25); text.setAttribute("y", yPos + 5);
            text.setAttribute("fill", color); text.setAttribute("font-size", "20");
            text.textContent = pitchObj.acc;
            layer.appendChild(text);
        }
    }

    function handleKeyPress(playedNote, element) {
        clearTimeout(helpSequenceTimeout); // Stops visual playback if user inputs
        document.getElementById('feedback-layer').innerHTML = ''; // Clear visual scale artifacts
        document.getElementById('help-btn').disabled = false; // Re-enable help button
        
        const level = document.getElementById('level-select').value;
        
        element.classList.add('active');
        setTimeout(() => element.classList.remove('active'), 200);
        playSound(pitches[playedNote].f);
        
        if (level === 'freeplay') {
            const layer = document.getElementById('notes-layer');
            layer.innerHTML = '';
            
            drawNoteVisual(layer, 225, pitches[playedNote], "black", false);
            
            const noteName = playedNote.replace(/[0-9]/g, '');
            updateUIFeedback("🎶", noteName, "#2196F3");
            
            clearTimeout(visualTimeout);
            visualTimeout = setTimeout(() => {
                layer.innerHTML = '';
                updateUIFeedback("🎹", "Free Play!", "black");
            }, 1000);
            return;
        }
        
        if(currentIndex >= currentSequence.length) return;
        
        const targetNote = currentSequence[currentIndex];
        
        if (playedNote === targetNote) {
            updateUIFeedback("🎉 🐷", "Great Job!", "#4CAF50");
            window.speechSynthesis.cancel();
            currentIndex++;
            drawSequence();
            
            if(currentIndex >= currentSequence.length) {
                setTimeout(() => {
                    updateUIFeedback("🎉 🐷", "You did it!", "#4CAF50");
                    speak("Great job!");
                    setTimeout(loadExercise, 1500);
                }, 500);
            }
        } else {
            mistakes++;
            const isHigh = pitches[playedNote].m > pitches[targetNote].m;
            updateUIFeedback("😢", isHigh ? "Too High!" : "Too Low!", "red");
            speak(isHigh ? "Too high" : "Too low");
            showMistakeVisual(playedNote);
        }
    }

    function handleChoiceClick(selectedName, correctName, btn) {
        if(selectedName === correctName) {
            btn.classList.add('correct');
            chordProgress = currentChordTarget.notes; 
            drawSequence();
            updateUIFeedback("🎉 🐷", "Great Job!", "#4CAF50");
            window.speechSynthesis.cancel();
            speak(correctName);
            currentChordTarget.notes.forEach(n => playSound(pitches[n].f));
            
            setTimeout(loadExercise, 1500);
        } else {
            mistakes++;
            btn.classList.add('wrong');
            setTimeout(() => btn.classList.remove('wrong'), 800);
            updateUIFeedback("😢", "Try again!", "red");
            speak("Try again");
            if (mistakes >= 3) document.getElementById('help-btn').style.display = 'inline-block';
        }
    }

    function showMistakeVisual(playedNote) {
        if (mistakes >= 3) document.getElementById('help-btn').style.display = 'inline-block';
        const feedbackLayer = document.getElementById('feedback-layer');
        feedbackLayer.innerHTML = '';
        const x = 120 + (currentIndex * 45); // Aligned spacing
        drawNoteVisual(feedbackLayer, x, pitches[playedNote], "red", false);
        
        clearTimeout(visualTimeout);
        visualTimeout = setTimeout(() => { feedbackLayer.innerHTML = ''; }, 800);
    }

    function updateUIFeedback(emoji, text, color) {
        document.getElementById('face-emoji').textContent = emoji;
        const textSpan = document.getElementById('feedback-text');
        textSpan.textContent = text; textSpan.style.color = color;
    }
</script>
